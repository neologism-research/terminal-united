[package]
name = "terminal-united"
description = "A cozy social room living inside the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "terminal-united"
path = "src/main.rs"

[dependencies]
terminal-united-shared.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

crossterm = "0.29.0"
ratatui = "0.29.0"
color-eyre = "0.6.3"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
textwrap = "0.16.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
